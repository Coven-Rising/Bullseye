<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bullseye</title>
  <meta name="description" content="A daily estimation game. Ten questions, one slider, how close can you get?">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="marquee">
      <h1 class="logo">
        <svg class="logo-mark" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="17" fill="#ffffff"/><circle cx="18" cy="18" r="12" fill="#ff3d5a"/><circle cx="18" cy="18" r="7" fill="#ffffff"/><circle cx="18" cy="18" r="3" fill="#ffc93c"/></svg>
        Bullseye
      </h1>
      <span class="top-right">
        <span id="puzzle-no" class="puzzle-no"></span>
        <button id="sound" class="sound-btn" aria-pressed="true" aria-label="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </span>
    </div>
  </header>

  <main>
    <section id="screen-question" class="card" hidden>
      <div class="meta">
        <span id="q-progress" class="dots" role="img"></span>
        <span class="tags"><span id="q-fermi" class="tag fermi" hidden>Fermi estimate</span><span id="q-category" class="tag"></span></span>
      </div>
      <div class="bubble"><h2 id="q-prompt" class="prompt"></h2></div>

      <div class="readout">
        <button id="minus" class="nudge" aria-label="Decrease by 1">−</button>
        <input id="guess-box" type="number" inputmode="numeric" min="0" step="1" aria-label="Your guess">
        <button id="plus" class="nudge" aria-label="Increase by 1">+</button>
      </div>

      <input id="slider" type="range" min="0" aria-label="Drag to guess">
      <div class="scale"><span>0</span><span id="q-max"></span></div>

      <button id="lock" class="primary">Lock it in!</button>
    </section>

    <section id="screen-reveal" class="card" hidden>
      <p id="r-prompt" class="r-prompt"></p>
      <div class="points-row">
        <div class="tile tile-score">
          <span class="label">Score</span>
          <div class="points"><span id="r-points"></span><small>/100</small></div>
        </div>
        <div id="r-badge" class="tile tile-bull" hidden>
          <span class="label">Bullseye!</span>
          <svg class="bull-mark" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="17" fill="#ff3d5a"/><circle cx="18" cy="18" r="12" fill="#ffffff"/><circle cx="18" cy="18" r="7" fill="#ff3d5a"/><circle cx="18" cy="18" r="3" fill="#ffffff"/></svg>
        </div>
        <div id="r-accuracy" class="tile tile-off" hidden>
          <span class="label">Off by</span>
          <span id="r-accuracy-value" class="accuracy-value"></span>
        </div>
      </div>

      <div class="track" aria-hidden="true">
        <div id="t-window" class="t-window"></div>
        <div id="t-answer" class="t-mark t-answer"><span>Answer</span></div>
        <div id="t-guess" class="t-mark t-guess"><span>You</span></div>
      </div>
      <div class="scale"><span>0</span><span id="t-max"></span></div>

      <dl class="facts">
        <div><dt>Your answer</dt><dd id="r-guess"></dd></div>
        <div><dt>Correct answer</dt><dd id="r-answer"></dd></div>
      </dl>
      <p id="r-working" class="working" hidden></p>

      <button id="r-source-toggle" class="source-toggle" aria-expanded="false" aria-controls="r-source">Source</button>
      <div id="r-source" class="source-panel" hidden>
        <p id="r-source-note"></p>
        <p id="r-source-site" class="source-site"></p>
      </div>

      <button id="next" class="primary"></button>
    </section>

    <section id="screen-summary" class="card" hidden>
      <h2 class="summary-title">Today's score</h2>
      <div class="points big"><span id="s-total"></span><small>/<span id="s-max"></span></small></div>
      <p id="s-squares" class="squares"></p>
      <button id="share" class="primary">Copy result</button>
      <textarea id="share-text" class="share-text" rows="3" readonly hidden aria-label="Your result"></textarea>
      <ol id="s-list" class="s-list"></ol>
      <p class="come-back">New questions every day at midnight.</p>
      <button id="practice" class="secondary">Play another set (practice)</button>
    </section>
  </main>
